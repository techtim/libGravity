; PlatformIO configuration for libGravity.
;
;   pio test -e native          -> host unit tests (ArduinoFake + Unity), no board
;   pio run  -e gravityplus     -> build the GravityPlus firmware for an Arduino Nano
;   pio run  -e modal           -> build the Modal firmware
;   pio run  -e euclidean        / -e gravity  -> the two reference firmwares
;   pio run  -e <env> -t upload -> flash it
;
; The library itself lives in src/ (Arduino-IDE layout, library.properties). Each
; firmware lives in firmware/<Name>/. Every AVR env sets `custom_firmware` and a
; pre-script (scripts/select_firmware.py) repoints PROJECT_SRC_DIR at that folder,
; so only that firmware's sources (including its save_state.cpp) are compiled and
; linked - no reliance on archive link order. The native env ignores src entirely
; (build_src_filter = -<*>) and pulls its header-only test targets from test/.

[platformio]
src_dir = firmware/Euclidean
test_dir = test

[env]
build_flags = -std=gnu++11

; ---------------------------------------------------------------------------
; Host unit tests. Nothing from src/*.cpp or a sketch is compiled; every test
; target is header-only and included directly via the -I paths below. AVR-only
; headers (<util/atomic.h>, <avr/pgmspace.h>) are satisfied by test/native_compat.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
  -std=gnu++11
  -I src
  -I firmware/Euclidean
  -I test/native_compat
  ; ArduinoFake bundles FakeIt, whose `::template Assign(...)` usage newer Clang
  ; (19+) rejects by default. Silence that one diagnostic so the mock compiles.
  -Wno-missing-template-arg-list-after-template-kw
lib_deps = fabiobatsilva/ArduinoFake@^0.4.0
; ArduinoFake declares AVR/Arduino compatibility; allow it on the native platform.
lib_compat_mode = off
; The test targets are header-only (pulled in via -I src); never compile the
; AVR-only library or its heavy deps into the host build.
lib_ignore = libGravity, uClock, RotaryEncoder, U8g2
; Do NOT set `lib_ldf_mode = off` here: PlatformIO adds the Unity test framework's
; include path through the dependency finder, so disabling it breaks `unity.h`.

; ---------------------------------------------------------------------------
; Shared Arduino Nano firmware settings. Each firmware env below extends this and
; sets `custom_firmware`; the pre-script repoints the build at that sketch.
; Use board = nanoatmega328 for older 57600-baud bootloader Nanos.
; Link-time optimization (-flto) is off by default on atmelavr (the Arduino IDE
; enables it); it reclaims ~1-3 KB of flash needed to fit the 30720 B Nano.
; ---------------------------------------------------------------------------
[avr]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_extra_dirs = .
extra_scripts =
  pre:scripts/select_firmware.py
  pre:scripts/u8g2_8bit.py
build_flags =
  -flto
  -O3
lib_deps =
  olikraus/U8g2
  mathertel/RotaryEncoder
  gicking/NeoHWSerial

[env:gravityplus]
extends = avr
custom_firmware = GravityPlus

[env:modal]
extends = avr
custom_firmware = Modal

[env:euclidean]
extends = avr
custom_firmware = Euclidean

[env:gravity]
extends = avr
custom_firmware = Gravity
