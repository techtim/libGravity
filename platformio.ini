; PlatformIO configuration for libGravity.
;
;   pio test -e native   -> host unit tests (ArduinoFake + Unity), no board needed
;   pio run  -e nano     -> build the Euclidean firmware for an Arduino Nano
;   pio run  -e nano -t upload
;
; The library itself lives in src/ (Arduino-IDE layout, library.properties). The
; two firmwares live in firmware/Euclidean and firmware/Gravity. src_dir points
; at the Euclidean sketch as the representative Nano build; the native env
; ignores it (build_src_filter = -<*>) and pulls test sources from test/.

[platformio]
src_dir = firmware/Euclidean
test_dir = test

[env]
build_flags = -std=gnu++11

; ---------------------------------------------------------------------------
; Host unit tests. Nothing from src/*.cpp or the sketch is compiled; every test
; target is header-only and included directly via the -I paths below. AVR-only
; headers (<util/atomic.h>, <avr/pgmspace.h>) are satisfied by test/native_compat.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
  -std=gnu++11
  -I src
  -I firmware/Euclidean
  -I test/native_compat
  ; ArduinoFake bundles FakeIt, whose `::template Assign(...)` usage newer Clang
  ; (19+) rejects by default. Silence that one diagnostic so the mock compiles.
  -Wno-missing-template-arg-list-after-template-kw
lib_deps = fabiobatsilva/ArduinoFake@^0.4.0
; ArduinoFake declares AVR/Arduino compatibility; allow it on the native platform.
lib_compat_mode = off
; The test targets are header-only (pulled in via -I src); never compile the
; AVR-only library or its heavy deps into the host build.
lib_ignore = libGravity, uClock, RotaryEncoder, U8g2
; Do NOT set `lib_ldf_mode = off` here: PlatformIO adds the Unity test framework's
; include path through the dependency finder, so disabling it breaks `unity.h`.

; ---------------------------------------------------------------------------
; Arduino Nano firmware build / upload (Euclidean sketch).
; Use board = nanoatmega328 for older 57600-baud bootloader Nanos.
; ---------------------------------------------------------------------------
[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_extra_dirs = .
lib_deps =
  olikraus/U8g2
  mathertel/RotaryEncoder
  gicking/NeoHWSerial
