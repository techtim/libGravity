name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Native unit tests (ArduinoFake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Run tests
        run: pio test -e native

  firmware-build:
    name: Build firmware (Arduino Nano)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build all firmwares
        # Each firmware has its own env (see platformio.ini); build them all so a
        # break in any sketch fails CI.
        run: pio run -e euclidean -e gravity -e modal -e gravityplus

  release:
    name: Release firmware
    # Only run on tag pushes (e.g. `git tag v2.0.2 && git push --tags`), and only
    # after the tests and firmware builds pass.
    needs: [unit-tests, firmware-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the release and upload assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build all firmwares
        run: pio run -e euclidean -e gravity -e modal -e gravityplus

      - name: Collect firmware artifacts
        # Each env writes to its own .pio/build/<env>/firmware.hex.
        run: |
          cp .pio/build/euclidean/firmware.hex gravity-euclidean-${{ github.ref_name }}.hex
          cp .pio/build/gravity/firmware.hex gravity-classic-${{ github.ref_name }}.hex
          cp .pio/build/modal/firmware.hex gravity-modal-${{ github.ref_name }}.hex
          cp .pio/build/gravityplus/firmware.hex gravity-plus-${{ github.ref_name }}.hex

      - name: Create GitHub release with firmware artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gravity-euclidean-${{ github.ref_name }}.hex
            gravity-classic-${{ github.ref_name }}.hex
            gravity-modal-${{ github.ref_name }}.hex
            gravity-plus-${{ github.ref_name }}.hex
          generate_release_notes: true
