name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Native unit tests (ArduinoFake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Run tests
        run: pio test -e native

  firmware-build:
    name: Build firmware (Arduino Nano)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build Euclidean firmware
        run: pio run -e nano
      - name: Build Gravity firmware
        # src_dir defaults to firmware/Euclidean; override it to compile-check
        # the second sketch with the same toolchain and library.
        env:
          PLATFORMIO_SRC_DIR: firmware/Gravity
        run: pio run -e nano
